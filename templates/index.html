<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Hospital Management System</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 1200px;
            margin: 0 auto;
            padding: 20px;
            background-color: #f4f4f4;
        }
        .container {
            background-color: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
        }
        .form-group input, 
        .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
        }
        .btn {
            background-color: #007bff;
            color: white;
            border: none;
            padding: 10px 20px;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn:hover {
            background-color: #0056b3;
        }
        #patientTable, #scheduleTable {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }
        #patientTable th, 
        #patientTable td,
        #scheduleTable th, 
        #scheduleTable td {
            border: 1px solid #ddd;
            padding: 8px;
            text-align: left;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Hospital Management System</h1>
        
        <!-- Patient Registration Form -->
        <div class="form-group">
            <h2>Patient Registration</h2>
            <form id="patientForm">
                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" id="firstName" required>
                </div>
                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" id="lastName" required>
                </div>
                <div class="form-group">
                    <label>Birth Date</label>
                    <input type="date" id="birthDate" required>
                </div>
                <div class="form-group">
                    <label>Gender</label>
                    <select id="gender">
                        <option value="Male">Male</option>
                        <option value="Female">Female</option>
                        <option value="Other">Other</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Contact Number</label>
                    <input type="tel" id="contactNumber" required>
                </div>
                <div class="form-group">
                    <label>Email</label>
                    <input type="email" id="email" required>
                </div>
                <button type="submit" class="btn">Register Patient</button>
            </form>
        </div>

        <!-- Doctor Schedule Form -->
        <div class="form-group">
            <h2>Doctor Schedule</h2>
            <form id="scheduleForm">
                <div class="form-group">
                    <label>Doctor</label>
                    <select id="doctorSelect">
                        <option value="1">Dr. Smith</option>
                        <option value="2">Dr. Johnson</option>
                        <option value="3">Dr. Williams</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Date</label>
                    <input type="date" id="scheduleDate" required>
                </div>
                <div class="form-group">
                    <label>Start Time</label>
                    <input type="time" id="startTime" required>
                </div>
                <div class="form-group">
                    <label>End Time</label>
                    <input type="time" id="endTime" required>
                </div>
                <button type="submit" class="btn">Create Schedule</button>
            </form>
        </div>

        <!-- Patient Table -->
        <h2>Registered Patients</h2>
        <table id="patientTable">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Name</th>
                    <th>Birth Date</th>
                    <th>Gender</th>
                    <th>Contact</th>
                </tr>
            </thead>
            <tbody id="patientTableBody"></tbody>
        </table>

        <!-- Doctor Schedule Table -->
        <h2>Doctor Schedules</h2>
        <table id="scheduleTable">
            <thead>
                <tr>
                    <th>Doctor</th>
                    <th>Date</th>
                    <th>Start Time</th>
                    <th>End Time</th>
                </tr>
            </thead>
            <tbody id="scheduleTableBody"></tbody>
        </table>
    </div>

    <script>
        document.getElementById('patientForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const patient = {
                firstName: document.getElementById('firstName').value,
                lastName: document.getElementById('lastName').value,
                birthDate: document.getElementById('birthDate').value,
                gender: document.getElementById('gender').value,
                contactNumber: document.getElementById('contactNumber').value,
                email: document.getElementById('email').value
            };

            fetch('/api/patients', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(patient)
            })
            .then(response => response.json())
            .then(data => {
                alert('Patient Registered Successfully');
                loadPatients();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Registration Failed');
            });
        });

        document.getElementById('scheduleForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const schedule = {
                doctorId: document.getElementById('doctorSelect').value,
                scheduleDate: document.getElementById('scheduleDate').value,
                startTime: document.getElementById('startTime').value,
                endTime: document.getElementById('endTime').value
            };

            fetch('/api/schedules', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify(schedule)
            })
            .then(response => response.json())
            .then(data => {
                alert('Schedule Created Successfully');
                loadSchedules();
            })
            .catch(error => {
                console.error('Error:', error);
                alert('Schedule Creation Failed');
            });
        });

        function loadPatients() {
            fetch('/api/patients')
                .then(response => response.json())
                .then(patients => {
                    const tableBody = document.getElementById('patientTableBody');
                    tableBody.innerHTML = '';
                    patients.forEach(patient => {
                        const row = `
                            <tr>
                                <td>${patient.id}</td>
                                <td>${patient.firstName} ${patient.lastName}</td>
                                <td>${patient.birthDate}</td>
                                <td>${patient.gender}</td>
                                <td>${patient.contactNumber}</td>
                            </tr>
                        `;
                        tableBody.innerHTML += row;
                    });
                });
        }

        function loadSchedules() {
            fetch('/api/schedules')
                .then(response => response.json())
                .then(schedules => {
                    const tableBody = document.getElementById('scheduleTableBody');
                    tableBody.innerHTML = '';
                    schedules.forEach(schedule => {
                        const row = `
                            <tr>
                                <td>Dr. ${schedule.doctorName}</td>
                                <td>${schedule.scheduleDate}</td>
                                <td>${schedule.startTime}</td>
                                <td>${schedule.endTime}</td>
                            </tr>
                        `;
                        tableBody.innerHTML += row;
                    });
                });
        }

        // Load data on page load
        loadPatients();
        loadSchedules();
    </script>
</body>
</html>
